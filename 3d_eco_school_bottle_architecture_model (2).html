    <script>
        // ============================================================================
        // 1. PROCEDURAL HIGH-RES PBR TEXTURE GENERATORS
        // ============================================================================

        // Balanced Overcast Tropical Daylight HDRI Environment
        function createOvercastTropicalEnv(renderer) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            const skyGrad = ctx.createLinearGradient(0, 0, 0, 512);
            skyGrad.addColorStop(0.0, '#94a3b8');
            skyGrad.addColorStop(0.38, '#64748b');
            skyGrad.addColorStop(0.49, '#475569');
            skyGrad.addColorStop(0.52, '#4a3525');
            skyGrad.addColorStop(1.0, '#1e150f');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, 1024, 512);

            for (let i = 0; i < 24; i++) {
                const x = Math.random() * 1024;
                const y = 25 + Math.random() * 170;
                const r = 40 + Math.random() * 95;
                const rad = ctx.createRadialGradient(x, y, 5, x, y, r);
                rad.addColorStop(0, 'rgba(248, 250, 252, 0.38)');
                rad.addColorStop(1, 'rgba(248, 250, 252, 0.0)');
                ctx.fillStyle = rad;
                ctx.fillRect(x - r, y - r, r * 2, r * 2);
            }

            const envTex = new THREE.CanvasTexture(canvas);
            envTex.mapping = THREE.EquirectangularReflectionMapping;
            envTex.encoding = THREE.sRGBEncoding;

            const pmrem = new THREE.PMREMGenerator(renderer);
            pmrem.compileEquirectangularShader();
            const rt = pmrem.fromEquirectangular(envTex);
            envTex.dispose();
            pmrem.dispose();
            return rt.texture;
        }

        // High-Resolution Procedural Ribbed PET Bottle Surface Bump & Roughness Map
        function createPETBottleSurfaceMaps() {
            const cBump = document.createElement('canvas');
            const cRough = document.createElement('canvas');
            cBump.width = cRough.width = 256;
            cBump.height = cRough.height = 512;
            const ctxB = cBump.getContext('2d');
            const ctxR = cRough.getContext('2d');

            ctxB.fillStyle = '#808080';
            ctxB.fillRect(0, 0, 256, 512);
            ctxR.fillStyle = '#383838';
            ctxR.fillRect(0, 0, 256, 512);

            [90, 145, 200, 255, 310, 365, 420].forEach(y => {
                const g = ctxB.createLinearGradient(0, y - 8, 0, y + 8);
                g.addColorStop(0.0, '#808080');
                g.addColorStop(0.3, '#ffffff');
                g.addColorStop(0.7, '#181818');
                g.addColorStop(1.0, '#808080');
                ctxB.fillStyle = g;
                ctxB.fillRect(0, y - 8, 256, 16);
            });

            for (let i = 0; i < 900; i++) {
                const x = Math.random() * 256;
                const y = Math.random() * 512;
                ctxR.fillStyle = Math.random() > 0.5 ? '#585858' : '#262626';
                ctxR.fillRect(x, y, 3, 2);
            }

            const bumpMap = new THREE.CanvasTexture(cBump);
            const roughnessMap = new THREE.CanvasTexture(cRough);
            bumpMap.wrapS = bumpMap.wrapT = roughnessMap.wrapS = roughnessMap.wrapT = THREE.RepeatWrapping;
            bumpMap.repeat.set(1, 1);
            roughnessMap.repeat.set(1, 1);
            return { bumpMap, roughnessMap };
        }

        // UNIFORM BASE FOUNDATION TILE MAPS (Consistent rich earthy foundation tiles across all faces, zero whitewash)
        function createUniformBaseTileMaps() {
            const cDiff = document.createElement('canvas');
            const cBump = document.createElement('canvas');
            const cRough = document.createElement('canvas');
            cDiff.width = cBump.width = cRough.width = 1024;
            cDiff.height = cBump.height = cRough.height = 1024;

            const ctxD = cDiff.getContext('2d');
            const ctxB = cBump.getContext('2d');
            const ctxR = cRough.getContext('2d');

            ctxD.fillStyle = '#392d24';
            ctxD.fillRect(0, 0, 1024, 1024);
            ctxB.fillStyle = '#808080';
            ctxB.fillRect(0, 0, 1024, 1024);
            ctxR.fillStyle = '#d0d0d0';
            ctxR.fillRect(0, 0, 1024, 1024);

            for (let i = 0; i < 7000; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const s = 2 + Math.random() * 8;
                ctxD.fillStyle = Math.random() > 0.5
                    ? 'rgba(46, 35, 27, 0.32)'
                    : 'rgba(68, 54, 44, 0.24)';
                ctxD.fillRect(x, y, s, s);

                ctxB.fillStyle = Math.random() > 0.5 ? '#949494' : '#6c6c6c';
                ctxB.fillRect(x, y, s * 0.7, s * 0.7);
            }

            const tileSize = 128;
            for (let x = 0; x <= 1024; x += tileSize) {
                ctxD.strokeStyle = 'rgba(18, 14, 10, 0.58)';
                ctxD.lineWidth = 3.5;
                ctxD.beginPath();
                ctxD.moveTo(x, 0);
                ctxD.lineTo(x, 1024);
                ctxD.stroke();

                ctxB.strokeStyle = '#282828';
                ctxB.lineWidth = 4;
                ctxB.beginPath();
                ctxB.moveTo(x, 0);
                ctxB.lineTo(x, 1024);
                ctxB.stroke();

                ctxD.strokeStyle = 'rgba(82, 68, 58, 0.32)';
                ctxD.lineWidth = 1.5;
                ctxD.beginPath();
                ctxD.moveTo(x + 2, 0);
                ctxD.lineTo(x + 2, 1024);
                ctxD.stroke();
            }
            for (let y = 0; y <= 1024; y += tileSize) {
                ctxD.strokeStyle = 'rgba(18, 14, 10, 0.58)';
                ctxD.lineWidth = 3.5;
                ctxD.beginPath();
                ctxD.moveTo(0, y);
                ctxD.lineTo(1024, y);
                ctxD.stroke();

                ctxB.strokeStyle = '#282828';
                ctxB.lineWidth = 4;
                ctxB.beginPath();
                ctxB.moveTo(0, y);
                ctxB.lineTo(1024, y);
                ctxB.stroke();

                ctxD.strokeStyle = 'rgba(82, 68, 58, 0.32)';
                ctxD.lineWidth = 1.5;
                ctxD.beginPath();
                ctxD.moveTo(0, y + 2);
                ctxD.lineTo(1024, y + 2);
                ctxD.stroke();
            }

            const map = new THREE.CanvasTexture(cDiff);
            const bumpMap = new THREE.CanvasTexture(cBump);
            const roughnessMap = new THREE.CanvasTexture(cRough);
            map.encoding = THREE.sRGBEncoding;
            map.wrapS = map.wrapT = bumpMap.wrapS = bumpMap.wrapT = roughnessMap.wrapS = roughnessMap.wrapT = THREE.RepeatWrapping;
            map.repeat.set(2, 2);
            bumpMap.repeat.set(2, 2);
            roughnessMap.repeat.set(2, 2);
            return { map, bumpMap, roughnessMap };
        }

        // Perforated Steel Wire Mesh Alpha Stencil Map
        function createWireMeshAlphaTexture(cellsX = 24, cellsY = 16, lineThickness = 2.5) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 512, 512);

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = lineThickness;

            const dx = 512 / cellsX;
            const dy = 512 / cellsY;

            for (let x = 0; x <= 512; x += dx) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, 512);
                ctx.stroke();
            }
            for (let y = 0; y <= 512; y += dy) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(512, y);
                ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 2);
            return tex;
        }

            function isInsideAnyCutout(u, v) {
                for (let k = 0; k < openings.length; k++) {
                    const op = openings[k];
                    if (u >= op.uMin && u <= op.uMax && v >= op.vMin && v <= op.vMax) return true;
                }
                return false;
            }

            const outerMats = [];
            const innerMats = [];
            const outerCols = [];
            const innerCols = [];
            const dummy = new THREE.Object3D();

            for (let ty = 0; ty < tiersY; ty++) {
                for (let ry = 0; ry < bottleRowsPerTier; ry++) {
                    const v = (ty + (ry + 0.5) / bottleRowsPerTier) * (tierH / 1.0);
                    const localY = ty * tierH + (ry + 0.5) * bdy;

                    for (let bx = 0; bx < baysX; bx++) {
                        for (let cx = 0; cx < bottleColsPerBay; cx++) {
                            const u = (bx + (cx + 0.5) / bottleColsPerBay) * bayW;
                            if (isInsideAnyCutout(u, v)) continue;

                            const localX = -width / 2 + u;
                            const rotY = (bx * 7 + ty * 3 + cx) * 0.45;
                            const sVar = 0.96 + ((bx * 3 + cx) % 5) * 0.015;

                            dummy.position.set(localX, localY, 0.038);
                            dummy.rotation.set(0, rotY, 0);
                            dummy.scale.set(sVar, sVar, sVar);
                            dummy.updateMatrix();
                            outerMats.push(dummy.matrix.clone());

                            const lumOuter = 0.90 + ((bx + cx + ty) % 7) * 0.035;
                            tmpCol.copy(baseCol).multiplyScalar(lumOuter);
                            outerCols.push(tmpCol.r, tmpCol.g, tmpCol.b);

                            dummy.position.set(localX, localY, -0.038);
                            dummy.rotation.set(0, rotY + Math.PI, 0);
                            dummy.scale.set(sVar, sVar, sVar);
                            dummy.updateMatrix();
                            innerMats.push(dummy.matrix.clone());

                            const lumInner = 0.84 + ((bx * 2 + ty) % 5) * 0.038;
                            tmpCol.copy(baseCol).multiplyScalar(lumInner);
                            innerCols.push(tmpCol.r, tmpCol.g, tmpCol.b);
                        }
                    }
                }
            }

            const instMesh = new THREE.InstancedMesh(uprightBottleGeo, bottleMat, outerMats.length + innerMats.length);
            wallGroup.userData.instMesh = instMesh;
            wallGroup.userData.outerMats = outerMats;
            wallGroup.userData.innerMats = innerMats;
            wallGroup.userData.outerCols = outerCols;
            wallGroup.userData.innerCols = innerCols;
            wallGroup.userData.baseColHex = baseColorHex;
            let idx = 0;
            for (let i = 0; i < outerMats.length; i++) {
                instMesh.setMatrixAt(idx, outerMats[i]);
                instMesh.setColorAt(idx, new THREE.Color(outerCols[i * 3], outerCols[i * 3 + 1], outerCols[i * 3 + 2]));
                idx++;
            }
            for (let i = 0; i < innerMats.length; i++) {
                instMesh.setMatrixAt(idx, innerMats[i]);
                instMesh.setColorAt(idx, new THREE.Color(innerCols[i * 3], innerCols[i * 3 + 1], innerCols[i * 3 + 2]));
                idx++;
            }
            instMesh.instanceMatrix.needsUpdate = true;
            if (instMesh.instanceColor) instMesh.instanceColor.needsUpdate = true;
            instMesh.castShadow = true;
            instMesh.receiveShadow = true;
            wallGroup.add(instMesh);

            const cageDepth = 0.165;
            const postW = 0.044;

            for (let b = 0; b <= baysX; b++) {
                const px = -width / 2 + b * bayW;
                const post = new THREE.Mesh(new THREE.BoxGeometry(postW, height, cageDepth), steelMat);
                post.position.set(px, height / 2, 0);
                post.castShadow = true;
                wallGroup.add(post);
            }

            for (let t = 0; t <= tiersY; t++) {
                const py = t * tierH;
                const rail = new THREE.Mesh(new THREE.BoxGeometry(width + postW, 0.040, cageDepth), steelMat);
                rail.position.set(0, py, 0);
                rail.castShadow = true;
                wallGroup.add(rail);
            }

            for (let t = 0; t < tiersY; t++) {
                const midY = (t + 0.5) * tierH;
                [-cageDepth / 2, cageDepth / 2].forEach(rz => {
                    const midRail = new THREE.Mesh(new THREE.BoxGeometry(width, 0.022, 0.024), steelMat);
                    midRail.position.set(0, midY, rz);
                    wallGroup.add(midRail);
                });
            }

            for (let b = 0; b < baysX; b++) {
                for (let t = 0; t < tiersY; t++) {
                    const bayU = (b + 0.5) * bayW;
                    const tierV = (t + 0.5) * tierH;
                    if (isInsideAnyCutout(bayU, tierV)) continue;

                    const bayX = -width / 2 + (b + 0.5) * bayW;
                    const bayY = (t + 0.5) * tierH;

                            new THREE.PlaneGeometry(bayW - 0.012, tierH - 0.012),

                        meshPlane.position.set(bayX, bayY, mz);
                        if (mz < 0) meshPlane.rotation.y = Math.PI;
                        wallGroup.add(meshPlane);
                    });
                }
            }

            return wallGroup;
        }

        // ============================================================================
        // 11. SLOPED MONO-PITCH CORRUGATED IRON ROOF (Continuous Same Structure, NO Extra Grey Box!)
        // ============================================================================
        function buildMonoPitchCorrugatedRoof() {
            const roofGroup = new THREE.Group();
            roofGroup.name = 'MonoPitch_Corrugated_Roof';
            schoolModel.add(roofGroup);

            const baseTopY = wallStartY + WALL_H;
            const leftRise = ROOF_RISE_LEFT;
            const rightRise = ROOF_RISE_RIGHT;

            function getRiseAtX(x) {
                const t = (x + BW / 2) / BW;
                return leftRise * (1 - t) + rightRise * t;
            }

            // 1. Sloped Trapezoidal Upper Bottle Frieze (Front Black / Rear Orange matching School-1.jpeg!)
            let frontFriezeInstMesh = null;
            [BL / 2, -BL / 2].forEach(wz => {
                const isFront = wz > 0;
                const friezeMat = isFront ? blackPETMat : orangePETMat;
                const friezeHex = isFront ? 0x141519 : 0xdf7812;

                const wedgeShape = new THREE.Shape();
                wedgeShape.moveTo(-BW / 2, 0);
                wedgeShape.lineTo( BW / 2, 0);
                wedgeShape.lineTo( BW / 2, rightRise);
                wedgeShape.lineTo(-BW / 2, leftRise);
                wedgeShape.closePath();

                const wedgeGeo = new THREE.ExtrudeGeometry(wedgeShape, { depth: 0.14, bevelEnabled: false });
                const wedgeMesh = new THREE.Mesh(wedgeGeo, new THREE.MeshStandardMaterial({ color: 0x101216, roughness: 0.85 }));
                wedgeMesh.position.set(0, baseTopY, wz - 0.07);
                wedgeMesh.castShadow = true;
                roofGroup.add(wedgeMesh);

                const cols = Math.floor(BW / 0.076);
                const dummy = new THREE.Object3D();
                const mats = [];
                for (let c = 0; c < cols; c++) {
                    const x = -BW / 2 + (c + 0.5) * 0.076;
                    const localRise = getRiseAtX(x);
                    const numRows = Math.max(1, Math.round(localRise / 0.27));
                    const rowH = localRise / numRows;
                    for (let r = 0; r < numRows; r++) {
                        const y = baseTopY + (r + 0.5) * rowH;
                        dummy.position.set(x, y, wz + (wz > 0 ? 0.032 : -0.032));
                        dummy.rotation.set(0, c * 0.4 + r, 0);
                        dummy.scale.set(0.98, Math.min(1.05, (rowH - 0.015) / 0.282), 0.98);
                        dummy.updateMatrix();
                        mats.push(dummy.matrix.clone());
                    }
                }
                const friezeInst = new THREE.InstancedMesh(uprightBottleGeo, friezeMat, mats.length);
                const baseCol = new THREE.Color(friezeHex);
                const tmpCol = new THREE.Color();
                for (let i = 0; i < mats.length; i++) {
                    friezeInst.setMatrixAt(i, mats[i]);
                    const s = 0.90 + (i % 7) * 0.03;
                    tmpCol.copy(baseCol).multiplyScalar(s);
                    friezeInst.setColorAt(i, tmpCol);
                }
                friezeInst.instanceMatrix.needsUpdate = true;
                if (friezeInst.instanceColor) friezeInst.instanceColor.needsUpdate = true;
                roofGroup.add(friezeInst);
                if (isFront) frontFriezeInstMesh = friezeInst;

                for (let b = 0; b <= 8; b++) {
                    const x = -BW / 2 + (b / 8) * BW;
                    const postH = getRiseAtX(x);
                    const post = new THREE.Mesh(
                        new THREE.BoxGeometry(0.044, postH, 0.165),
                        blackSteelFrameMat
                    );
                    post.position.set(x, baseTopY + postH / 2, wz);
                    roofGroup.add(post);
                }
            });

            // 2. Left Side Wall Upper Orange Bottle Frieze Tier
            const leftWallBand = new THREE.Mesh(
                new THREE.BoxGeometry(0.14, leftRise, BL),
                new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.8 })
            );
            leftWallBand.position.set(-BW / 2, baseTopY + leftRise / 2, 0);
            roofGroup.add(leftWallBand);

            const sideCols = Math.floor(BL / 0.076);
            const leftDummy = new THREE.Object3D();
            const leftMats = [];
            for (let r = 0; r < 2; r++) {
                const rowH = leftRise / 2;
                const y = baseTopY + (r + 0.5) * rowH;
                for (let c = 0; c < sideCols; c++) {
                    const z = -BL / 2 + (c + 0.5) * 0.076;
                    leftDummy.position.set(-BW / 2 - 0.034, y, z);
                    leftDummy.rotation.set(0, c * 0.5, 0);
                    leftDummy.scale.set(0.98, (rowH - 0.02) / 0.282, 0.98);
                    leftDummy.updateMatrix();
                    leftMats.push(leftDummy.matrix.clone());
                }
            }
            const leftUpperInst = new THREE.InstancedMesh(uprightBottleGeo, orangePETMat, leftMats.length);
            for (let i = 0; i < leftMats.length; i++) {
                leftUpperInst.setMatrixAt(i, leftMats[i]);
                const s = 0.92 + (i % 5) * 0.035;
                leftUpperInst.setColorAt(i, new THREE.Color(s, s, s));
            }
            leftUpperInst.instanceMatrix.needsUpdate = true;
            if (leftUpperInst.instanceColor) leftUpperInst.instanceColor.needsUpdate = true;
            roofGroup.add(leftUpperInst);

            for (let b = 0; b <= 11; b++) {
                const z = -BL / 2 + (b / 11) * BL;
                const post = new THREE.Mesh(
                    new THREE.BoxGeometry(0.165, leftRise, 0.044),
                    blackSteelFrameMat
                );
                post.position.set(-BW / 2, baseTopY + leftRise / 2, z);
                roofGroup.add(post);
            }
            const leftTopPlate = new THREE.Mesh(
                new THREE.BoxGeometry(0.17, 0.045, BL + 0.04),
                blackSteelFrameMat
            );
            leftTopPlate.position.set(-BW / 2, baseTopY + leftRise - 0.02, 0);
            roofGroup.add(leftTopPlate);

            const rightTopPlate = new THREE.Mesh(
                new THREE.BoxGeometry(0.17, rightRise, BL + 0.04),
                blackSteelFrameMat
            );
            rightTopPlate.position.set(BW / 2, baseTopY + rightRise / 2, 0);
            roofGroup.add(rightTopPlate);

            // 3. Sloped Timber Roof Structure
            const overhangLeft = 0.56;
            const overhangRight = 0.52;
            const overhangFront = 0.62;
            const overhangRear = 0.50;

            const slopeAngleZ = -Math.atan2(leftRise - rightRise, BW);
            const cosPitch = Math.cos(slopeAngleZ);
            const roofSpanW = (BW + overhangLeft + overhangRight) / cosPitch;
            const roofSpanL = BL + overhangFront + overhangRear;

            const midRoofY = baseTopY + (leftRise + rightRise) / 2;
            const centerOffsetX = (overhangRight - overhangLeft) / 2;
            const centerOffsetZ = (overhangFront - overhangRear) / 2;

            const pitchedAssembly = new THREE.Group();
            pitchedAssembly.position.set(centerOffsetX, midRoofY, centerOffsetZ);
            pitchedAssembly.rotation.z = slopeAngleZ;
            roofGroup.add(pitchedAssembly);

            // Dark wooden ceiling soffit flush at bottom of roof plane
            const soffitDeck = new THREE.Mesh(
                new THREE.BoxGeometry(BW + 0.08, 0.025, BL + 0.08),
                darkSoffitWoodMat
            );
            soffitDeck.position.set(-centerOffsetX, 0.01, -centerOffsetZ);
            pitchedAssembly.add(soffitDeck);

            // Hardwood Rafters under the roof
            const numRafters = 13;
            for (let i = 0; i < numRafters; i++) {
                const rz = -roofSpanL / 2 + 0.14 + (i / (numRafters - 1)) * (roofSpanL - 0.28);
                const rafter = new THREE.Mesh(
                    new THREE.BoxGeometry(roofSpanW - 0.06, 0.075, 0.048),
                    weatheredWoodMat
                );
                rafter.position.set(0, 0.045, rz);
                rafter.castShadow = true;
                rafter.receiveShadow = true;
                pitchedAssembly.add(rafter);
            }

            // Fascia Boards around all 4 eaves
            const frontFascia = new THREE.Mesh(
                new THREE.BoxGeometry(roofSpanW + 0.04, 0.155, 0.038),
                fasciaTimberMat
            );
            frontFascia.position.set(0, 0.068, roofSpanL / 2 - 0.018);
            frontFascia.castShadow = true;
            pitchedAssembly.add(frontFascia);

            const rearFascia = frontFascia.clone();
            rearFascia.position.z = -roofSpanL / 2 + 0.018;
            pitchedAssembly.add(rearFascia);

            [-roofSpanW / 2 + 0.018, roofSpanW / 2 - 0.018].forEach(sx => {
                const sideFascia = new THREE.Mesh(
                    new THREE.BoxGeometry(0.038, 0.155, roofSpanL),
                    fasciaTimberMat
                );
                sideFascia.position.set(sx, 0.068, 0);
                sideFascia.castShadow = true;
                pitchedAssembly.add(sideFascia);
            });

            // 4. Continuous Sinusoidal Corrugated Galvanized Iron Roof Sheet
            // Unbroken, continuous structure across the entire roof with ZERO extra grey box or poking beams!
            const waves = 46;
            const sheetGeo = new THREE.PlaneGeometry(roofSpanW + 0.08, roofSpanL + 0.10, 64, 240);
            sheetGeo.rotateX(-Math.PI / 2);
            const posAttr = sheetGeo.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                const z = posAttr.getZ(i);
                const waveH = Math.sin((z / roofSpanL) * waves * Math.PI * 2) * 0.015;
                posAttr.setY(i, waveH);
            }
            sheetGeo.computeVertexNormals();

            const corrugatedRoofMesh = new THREE.Mesh(sheetGeo, rustyCorrugatedMat);
            corrugatedRoofMesh.position.set(0, 0.155, 0);
            corrugatedRoofMesh.castShadow = true;
            corrugatedRoofMesh.receiveShadow = true;
            pitchedAssembly.add(corrugatedRoofMesh);
        }
        buildMonoPitchCorrugatedRoof();

        // ============================================================================
        // 12. CORNER-MOUNTED "SLUM ART" SIGNBOARD
        // ============================================================================
        function buildCornerSlumArtSign() {

        // ============================================================================

        const cameraPresets = {

        let activeTween = null;

        function transitionCamera(presetKey) {
            const preset = cameraPresets[presetKey];
            if (!preset) return;

            autoOrbit = false;
            updateOrbitUI();

            activeTween = {
                startPos: camera.position.clone(),
                endPos: preset.pos.clone(),

                endTarget: preset.target.clone(),
                startTime: performance.now(),
                duration: 900
            };

            });
        });

        // Interactive Bottle Palette Switcher (Site Reference vs All Orange)
        let activePalette = 'reference'; // 'reference' (Black Front / Orange Sides) or 'all_orange'
        function toggleBottlePalette() {
            activePalette = (activePalette === 'reference') ? 'all_orange' : 'reference';
            const isRef = (activePalette === 'reference');

            // 1. Toggle Front Wall instanced mesh material and colors
            if (frontWall && frontWall.userData && frontWall.userData.instMesh) {
                const fInst = frontWall.userData.instMesh;
                fInst.material = isRef ? blackPETMat : orangePETMat;
                const baseCol = new THREE.Color(isRef ? 0x141519 : 0xdf7812);
                const tmpCol = new THREE.Color();
                let idx = 0;
                for (let i = 0; i < frontWall.userData.outerMats.length; i++) {
                    const lum = 0.90 + ((i) % 7) * 0.035;
                    tmpCol.copy(baseCol).multiplyScalar(lum);
                    fInst.setColorAt(idx++, tmpCol);
                }
                for (let i = 0; i < frontWall.userData.innerMats.length; i++) {
                    const lum = 0.84 + ((i) % 5) * 0.038;
                    tmpCol.copy(baseCol).multiplyScalar(lum);
                    fInst.setColorAt(idx++, tmpCol);
                }
                if (fInst.instanceColor) fInst.instanceColor.needsUpdate = true;
            }

            // 2. Toggle Front Sloped Upper Frieze instanced mesh
            if (frontFriezeInstMesh) {
                frontFriezeInstMesh.material = isRef ? blackPETMat : orangePETMat;
                const baseCol = new THREE.Color(isRef ? 0x141519 : 0xdf7812);
                const tmpCol = new THREE.Color();
                for (let i = 0; i < frontFriezeInstMesh.count; i++) {
                    const lum = 0.90 + (i % 7) * 0.03;
                    tmpCol.copy(baseCol).multiplyScalar(lum);
                    frontFriezeInstMesh.setColorAt(i, tmpCol);
                }
                if (frontFriezeInstMesh.instanceColor) frontFriezeInstMesh.instanceColor.needsUpdate = true;
            }

            // 3. Update UI Button
            const pLabel = document.getElementById('palette-label');
            const pBtn = document.getElementById('btn-palette');
            if (pLabel) {
                pLabel.textContent = isRef ? 'Palette: Site Photos' : 'Palette: All Orange';
            }
            if (pBtn) {
                if (isRef) {
                    pBtn.classList.remove('bg-orange-600/40', 'text-white');
                    pBtn.classList.add('text-amber-300');
                } else {
                    pBtn.classList.add('bg-orange-600/40', 'text-white');
                    pBtn.classList.remove('text-amber-300');
                }
            }
            showToast(isRef ? 'Active Palette: Site Photos (Black Front / Orange Sides)' : 'Active Palette: All-Orange Bottles Facade');
        }

        const btnPalette = document.getElementById('btn-palette');
        if (btnPalette) {

        const btnOrbit = document.getElementById('btn-orbit');
        const orbitDot = document.getElementById('orbit-dot');

        function updateOrbitUI() {
            if (autoOrbit) {
                btnOrbit.classList.add('active');
                orbitDot.className = 'w-2 h-2 rounded-full bg-slate-900 animate-ping';
            } else {
                btnOrbit.classList.remove('active');
                orbitDot.className = 'w-2 h-2 rounded-full bg-slate-400';
            }
        }

        btnOrbit.addEventListener('click', () => {
            autoOrbit = !autoOrbit;
            updateOrbitUI();
            if (autoOrbit) {
                camButtons.forEach(b => b.classList.remove('active'));
            }
        });

        controls.addEventListener('start', () => {
            if (autoOrbit) {
                autoOrbit = false;

            activeTween = null;
        });

        // Standalone .GLB Exporter
        const btnGlb = document.getElementById('btn-glb');
        const toast = document.getElementById('toast');

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3200);
        }

        btnGlb.addEventListener('click', () => {
            showToast('Exporting high-fidelity .GLB 3D model...');
            setTimeout(() => {
                const exporter = new THREE.GLTFExporter();
                exporter.parse(
                    schoolModel,
                    function (gltf) {
                        const blob = new Blob([gltf], { type: 'model/gltf-binary' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'Slum_Art_Orange_Bottle_School_Model.glb';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        showToast('✓ .GLB downloaded successfully!');
                    },
                    { binary: true, embedImages: true }
                );
            }, 50);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate(now) {
            requestAnimationFrame(animate);

            if (activeTween) {
                const elapsed = now - activeTween.startTime;
                const progress = Math.min(1.0, elapsed / activeTween.duration);
                const t = 1 - Math.pow(1 - progress, 4);

                camera.position.lerpVectors(activeTween.startPos, activeTween.endPos, t);
                controls.target.lerpVectors(activeTween.startTarget, activeTween.endTarget, t);

                if (progress >= 1.0) {
                    activeTween = null;
                }
            }

            if (autoOrbit && !activeTween) {
                const radius = Math.hypot(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
                const currentAngle = Math.atan2(camera.position.z - controls.target.z, camera.position.x - controls.target.x);
                const newAngle = currentAngle + 0.0035;
                camera.position.x = controls.target.x + radius * Math.cos(newAngle);
                camera.position.z = controls.target.z + radius * Math.sin(newAngle);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = function () {
            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
